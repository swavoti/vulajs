# vulaism.config.yaml
# Vula.js project configuration file.
# All options are optional - defaults will apply when omitted.

app:
  name: "My Vula App"
  # Path to favicon/icon, relative to project root (from assets/ folder)
  icon: "assets/vula.jpeg"
  # Default HTML language attribute
  lang: "en"

optimization:
  # Enable text optimizations (minification hints, compression headers)
  text-opt: true
  # Preload critical fonts via <link rel="preload">
  font-preload: true
  # CSS font-display strategy: swap | block | fallback | optional
  font-display: "swap"
  # Remove unused glyphs from fonts in production builds
  font-subset: true
  # Enable image compression hints during build
  image-compression: true
  # Minify injected HTML tags
  minify-html: false

security:
  # Enable CSRF origin protection middleware
  csrf: true
  # Whitelist cross-origin callers for CSRF (empty = same-origin only)
  allowed-origins: []
  # Inject Content-Security-Policy headers (true = strict nonce policy, false = off, or custom string)
  content-security-policy: true
  # Require authentication / authorize() / isPublic = true on *.sever.comp.ts RPC endpoints
  server-component-auth: true

proxy:
  # Enable the built-in HTTP proxy
  enabled: false
  # Target URL to proxy requests to
  target: "http://localhost:8080"
  # URL prefix to trigger the proxy
  prefix: "/proxy"

server:
  # Port to run the dev server on
  port: 3000
  # Enable gzip compression for responses
  compression: true
  # Trust X-Forwarded-* headers (set true when behind a reverse proxy)
  trust-proxy: false

modules:
  # Automatically load and register @swavoti/video-opti middleware
  video-opti: true
  # Automatically load and register @swavoti/image-opti middleware
  image-opti: true
  # Experimental Server-Side Rendering
  ssr: true

streaming:
  # Server-side streaming is enabled globally by default (keeps application logic and bundles on the server)
  enabled: true
  # Stream every matched page route from the server without shipping JS chunks/hydration
  global: true
  # Visual quality preset for canvas surfaces: "hd" | "lossless" | "balanced"
  quality: "hd"
  # Preferred encoder format for *.stream.* canvas surfaces: "vp8" | "vp9" | "h264" | "av1"
  codec: "vp8"
  # Max stream FPS and capped viewport dimensions
  fps: 30
  max-width: 1920
  max-height: 1080
  # Idle timeout (ms) before tearing down inactive stream sessions
  idle-timeout-ms: 60000
  # Forward server/site console.* logs to the client browser while streaming (keep false to avoid leaking internal site logs)
  allow-console-logs: false
  # Progressively load and stream UI components one-by-one as they paint to minimize cold-start latency
  dynamic-loading: true
